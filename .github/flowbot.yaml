# Test configuration for flowbot merge-queue batching.
modules:
  merge-queue:
    enabled: true
    merge-method: squash
    ci:
      workflows:
        - batch-ci.yml
      timeout-minutes: 15
      # No spot runners here, and a retry would only muddy the attribution
      # signal we're trying to observe.
      max-interruption-retries: 0
    batching:
      enabled: true
      max-size: 4
      # Dispatch as soon as the queue goes non-empty; PRs labelled behind an
      # in-flight batch still gather for the next one.
      collect-window-seconds: 0
      # The whole point of this run: one cycle, exact attribution.
      speculation: true
