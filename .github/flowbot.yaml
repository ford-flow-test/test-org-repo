# Test configuration for flowbot merge-queue batching.
modules:
  merge-queue:
    enabled: true
    merge-method: squash
    ci:
      workflows:
        - batch-ci.yml
      timeout-minutes: 15
      # No spot runners here, and a retry would only muddy the attribution
      # signal we're trying to observe.
      max-interruption-retries: 0
    batching:
      enabled: true
      max-size: 10
      # 30s so a hand-labelled set of PRs lands in one batch. In production
      # 0 is the latency setting: the first PR off an idle queue dispatches
      # at once and later arrivals gather behind the in-flight batch.
      collect-window-seconds: 30
      # How many of the chain's CI runs may be in flight at once. The chain
      # is always complete -- one run per PR, each a verdict on exactly that
      # PR -- so this bounds runner pressure, not attribution. 2 keeps the
      # throttle observable in a hand-driven scenario.
      build-concurrency: 2
